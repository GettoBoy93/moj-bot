name: Deploy to Oracle Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote SSH commands
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            cd /home/ubuntu/moj-bot
            git pull
            tmux kill-session -t bot || true
            tmux new-session -d -s bot "cd /home/ubuntu/moj-bot && /home/ubuntu/moj-bot/venv/bin/python3 bot_kodovi.py"
